<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 760" width="1260" height="760" font-family="Arial, Helvetica, sans-serif">
  <title>Earitation wireframes: three screen states</title>
  <rect width="1260" height="760" fill="#ffffff"/>

  <!-- ============ Screen 1: consent ============ -->
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#0f172a">1. Before consent</text>
  <rect x="30" y="50" width="380" height="640" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- sidebar -->
  <rect x="30" y="50" width="110" height="640" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="42" y="78" font-size="11" font-weight="bold" fill="#334155">Your settings</text>
  <text x="42" y="100" font-size="10" fill="#475569">Sounds that</text>
  <text x="42" y="112" font-size="10" fill="#475569">distract you</text>
  <rect x="42" y="118" width="86" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="47" y="132" font-size="9" fill="#64748b">[clicking] [typing]</text>
  <text x="47" y="144" font-size="9" fill="#64748b">[chewing] [banging]</text>
  <text x="47" y="156" font-size="9" fill="#64748b">[alarms] [speech]</text>
  <text x="42" y="184" font-size="10" fill="#475569">Score threshold</text>
  <line x1="42" y1="196" x2="128" y2="196" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="58" cy="196" r="5" fill="#64748b"/>
  <text x="42" y="222" font-size="10" fill="#475569">Minimum frames</text>
  <line x1="42" y1="234" x2="128" y2="234" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="60" cy="234" r="5" fill="#64748b"/>
  <!-- main -->
  <rect x="155" y="70" width="28" height="22" rx="3" fill="#e2e8f0"/>
  <text x="190" y="88" font-size="18" font-weight="bold" fill="#0f172a">Earitation</text>
  <rect x="155" y="104" width="240" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="155" y="118" width="190" height="8" rx="2" fill="#cbd5e1"/>
  <text x="155" y="146" font-size="9" fill="#64748b">Proof of concept. Not medical advice.</text>
  <text x="155" y="158" font-size="9" fill="#64748b">Sounds are only assessed within the clip.</text>
  <rect x="155" y="172" width="240" height="78" rx="4" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="165" y="190" font-size="10" font-weight="bold" fill="#0c4a6e">How your audio is handled</text>
  <rect x="165" y="200" width="215" height="6" rx="2" fill="#bae6fd"/>
  <rect x="165" y="212" width="215" height="6" rx="2" fill="#bae6fd"/>
  <rect x="165" y="224" width="180" height="6" rx="2" fill="#bae6fd"/>
  <rect x="155" y="266" width="14" height="14" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="177" y="277" font-size="10" fill="#0f172a">I understand how my audio is handled,</text>
  <text x="177" y="290" font-size="10" fill="#0f172a">and won't record others without consent.</text>
  <rect x="155" y="310" width="240" height="360" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="275" y="485" font-size="11" fill="#94a3b8" text-anchor="middle">Nothing else is shown</text>
  <text x="275" y="500" font-size="11" fill="#94a3b8" text-anchor="middle">until the box is ticked</text>

  <!-- ============ Screen 2: choose audio ============ -->
  <text x="440" y="34" font-size="16" font-weight="bold" fill="#0f172a">2. Choose or record audio</text>
  <rect x="440" y="50" width="380" height="640" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="440" y="50" width="110" height="640" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="452" y="78" font-size="11" font-weight="bold" fill="#334155">Your settings</text>
  <rect x="452" y="96" width="86" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="452" y="118" width="86" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="452" y="180" width="86" height="8" rx="2" fill="#cbd5e1"/>
  <line x1="452" y1="196" x2="538" y2="196" stroke="#94a3b8" stroke-width="3"/>
  <rect x="452" y="218" width="86" height="8" rx="2" fill="#cbd5e1"/>
  <line x1="452" y1="234" x2="538" y2="234" stroke="#94a3b8" stroke-width="3"/>
  <rect x="565" y="70" width="28" height="22" rx="3" fill="#e2e8f0"/>
  <text x="600" y="88" font-size="18" font-weight="bold" fill="#0f172a">Earitation</text>
  <rect x="565" y="104" width="240" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="565" y="120" width="240" height="44" rx="4" fill="#f0f9ff" stroke="#e0f2fe"/>
  <text x="575" y="146" font-size="9" fill="#94a3b8">(notice, collapsed for space)</text>
  <rect x="565" y="176" width="14" height="14" rx="2" fill="#475569"/>
  <path d="M568,183 l3,3 l6,-7" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="587" y="187" font-size="10" fill="#0f172a">I understand how my audio is handled...</text>
  <text x="565" y="218" font-size="10" fill="#475569">Audio source</text>
  <circle cx="572" cy="234" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="584" y="238" font-size="10" fill="#0f172a">Upload a file</text>
  <circle cx="672" cy="234" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="672" cy="234" r="3" fill="#475569"/>
  <text x="684" y="238" font-size="10" fill="#0f172a">Record with microphone</text>
  <text x="565" y="266" font-size="9" fill="#64748b">Record about 10 seconds. Avoid capturing</text>
  <text x="565" y="278" font-size="9" fill="#64748b">other people without their consent.</text>
  <rect x="565" y="292" width="240" height="58" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <circle cx="590" cy="321" r="11" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <circle cx="590" cy="321" r="5" fill="#dc2626"/>
  <text x="610" y="317" font-size="10" fill="#0f172a">Record a clip</text>
  <rect x="610" y="325" width="180" height="6" rx="2" fill="#e2e8f0"/>
  <text x="565" y="384" font-size="10" fill="#475569">or, with "Upload a file" chosen:</text>
  <rect x="565" y="394" width="240" height="70" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="685" y="424" font-size="10" fill="#0f172a" text-anchor="middle">Drag and drop an audio file</text>
  <text x="685" y="440" font-size="9" fill="#64748b" text-anchor="middle">WAV, FLAC, OGG, MP3 · up to 60 MB</text>
  <rect x="565" y="490" width="240" height="180" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="685" y="575" font-size="11" fill="#94a3b8" text-anchor="middle">Results appear here</text>
  <text x="685" y="590" font-size="11" fill="#94a3b8" text-anchor="middle">once audio is provided</text>

  <!-- ============ Screen 3: results ============ -->
  <text x="850" y="34" font-size="16" font-weight="bold" fill="#0f172a">3. Results</text>
  <rect x="850" y="50" width="380" height="640" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="850" y="50" width="110" height="640" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="862" y="78" font-size="11" font-weight="bold" fill="#334155">Your settings</text>
  <rect x="862" y="96" width="86" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="862" y="118" width="86" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="862" y="180" width="86" height="8" rx="2" fill="#cbd5e1"/>
  <line x1="862" y1="196" x2="948" y2="196" stroke="#94a3b8" stroke-width="3"/>
  <rect x="862" y="218" width="86" height="8" rx="2" fill="#cbd5e1"/>
  <line x1="862" y1="234" x2="948" y2="234" stroke="#94a3b8" stroke-width="3"/>
  <text x="975" y="76" font-size="9" fill="#94a3b8">(title, notice, consent and input above)</text>
  <rect x="975" y="86" width="240" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
  <path d="M988,92 l10,7 l-10,7 z" fill="#475569"/>
  <rect x="1006" y="97" width="196" height="4" rx="2" fill="#cbd5e1"/>
  <text x="975" y="136" font-size="12" font-weight="bold" fill="#0f172a">Top sounds detected</text>
  <rect x="975" y="144" width="240" height="96" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="975" y1="160" x2="1215" y2="160" stroke="#cbd5e1"/>
  <text x="981" y="155" font-size="9" font-weight="bold" fill="#334155">Sound</text>
  <text x="1150" y="155" font-size="9" font-weight="bold" fill="#334155">Mean score</text>
  <text x="981" y="174" font-size="9" fill="#475569">Typing</text><text x="1150" y="174" font-size="9" fill="#475569">0.412</text>
  <text x="981" y="190" font-size="9" fill="#475569">Computer keyboard</text><text x="1150" y="190" font-size="9" fill="#475569">0.351</text>
  <text x="981" y="206" font-size="9" fill="#475569">Speech</text><text x="1150" y="206" font-size="9" fill="#475569">0.210</text>
  <text x="981" y="222" font-size="9" fill="#475569">Inside, small room</text><text x="1150" y="222" font-size="9" fill="#475569">0.102</text>
  <text x="981" y="236" font-size="9" fill="#475569">Clicking</text><text x="1150" y="236" font-size="9" fill="#475569">0.064</text>
  <text x="975" y="254" font-size="9" fill="#64748b">Scores are confidence values, not probabilities.</text>
  <text x="975" y="282" font-size="12" font-weight="bold" fill="#0f172a">Recommendation</text>
  <rect x="975" y="290" width="240" height="44" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="985" y="308" font-size="10" font-weight="bold" fill="#14532d">Gentle instrumental audio:</text>
  <text x="985" y="324" font-size="9" fill="#14532d">soft, low-tempo music over small sounds</text>
  <rect x="975" y="346" width="240" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="975" y="358" width="240" height="6" rx="2" fill="#cbd5e1"/>
  <rect x="975" y="370" width="150" height="6" rx="2" fill="#cbd5e1"/>
  <text x="975" y="394" font-size="9" fill="#64748b">Plain-language explanation of why</text>
  <rect x="975" y="404" width="240" height="132" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="975" y1="420" x2="1215" y2="420" stroke="#cbd5e1"/>
  <text x="980" y="415" font-size="8" font-weight="bold" fill="#334155">Category</text>
  <text x="1040" y="415" font-size="8" font-weight="bold" fill="#334155">Frames</text>
  <text x="1085" y="415" font-size="8" font-weight="bold" fill="#334155">Peak</text>
  <text x="1115" y="415" font-size="8" font-weight="bold" fill="#334155">Label</text>
  <text x="1178" y="415" font-size="8" font-weight="bold" fill="#334155">Rule?</text>
  <text x="980" y="436" font-size="8" fill="#475569">Clicking</text><text x="1040" y="436" font-size="8" fill="#475569">1 of 12</text><text x="1085" y="436" font-size="8" fill="#475569">0.21</text><text x="1115" y="436" font-size="8" fill="#475569">Clicking</text><text x="1178" y="436" font-size="8" fill="#475569">No</text>
  <text x="980" y="456" font-size="8" fill="#475569">Typing</text><text x="1040" y="456" font-size="8" fill="#475569">7 of 12</text><text x="1085" y="456" font-size="8" fill="#475569">0.62</text><text x="1115" y="456" font-size="8" fill="#475569">Typing</text><text x="1178" y="456" font-size="8" font-weight="bold" fill="#14532d">Yes</text>
  <text x="980" y="476" font-size="8" fill="#475569">Chewing</text><text x="1040" y="476" font-size="8" fill="#475569">0 of 12</text><text x="1085" y="476" font-size="8" fill="#475569">0.01</text><text x="1115" y="476" font-size="8" fill="#475569">-</text><text x="1178" y="476" font-size="8" fill="#475569">No</text>
  <text x="980" y="496" font-size="8" fill="#475569">Banging</text><text x="1040" y="496" font-size="8" fill="#475569">0 of 12</text><text x="1085" y="496" font-size="8" fill="#475569">0.03</text><text x="1115" y="496" font-size="8" fill="#475569">-</text><text x="1178" y="496" font-size="8" fill="#475569">No</text>
  <text x="980" y="516" font-size="8" fill="#475569">Alarms</text><text x="1040" y="516" font-size="8" fill="#475569">0 of 12</text><text x="1085" y="516" font-size="8" fill="#475569">0.00</text><text x="1115" y="516" font-size="8" fill="#475569">-</text><text x="1178" y="516" font-size="8" fill="#475569">No</text>
  <text x="975" y="554" font-size="9" fill="#64748b">Per-category evidence table</text>
  <rect x="975" y="566" width="240" height="30" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="985" y="585" font-size="9" fill="#713f12">Warnings, e.g. clip too short for the rule</text>

  <!-- Annotations -->
  <text x="30" y="716" font-size="11" fill="#334155">Requirements shown: 1. NFR4 (caption), NFR6 (notice and consent gate), FR5 (settings sidebar, visible on every screen).</text>
  <text x="30" y="733" font-size="11" fill="#334155">2. FR1 (upload or record one clip), FR2 (errors shown in place of results).   3. FR4 (top five), FR7–FR9 (recommendation), FR10 (explanation, evidence), FR11 (warnings).</text>
  <text x="30" y="750" font-size="10" fill="#64748b">Low-fidelity wireframes drawn on 2026-11-16 from the first build, to document the layout. Example values are illustrative, not real output.</text>
</svg>
